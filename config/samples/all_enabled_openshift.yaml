apiVersion: helm-operator.sumologic.com/v1alpha1
kind: SumologicCollection
metadata:
  name: collection
spec:
  ## Sumo Logic Kubernetes Collection configuration file
  ## All the comments start with two or more # characters

  sumologic:
    ## Sumo access ID
    accessId: ""

    ## Sumo access key
    accessKey: ""

    ## Collector name
    # collectorName: ""

    ## Cluster name: Note spaces are not allowed and will be replaced with dashes.
    clusterName: "kubernetes"

    ## creation of Security Context Constraints in Openshift
    scc:
      create: true

    ## Helm Chart v6 enables sourceless mode by default, which registers collectors with an installation token.
    ## Keep it disabled to use the HTTP/OTLP sources created by the setup job.
    sourcelessMode: false

    ## Required by Helm Chart v6: acknowledge the single-layer metrics pipeline changes.
    ## See: https://www.sumologic.com/help/docs/send-data/kubernetes/v6/how-to-upgrade/
    metrics:
      collector:
        otelcol:
          singleLayerPipeline:
            migrationDocAcknowledged: true

  ## Configure metrics-server
  ## ref: https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
  metrics-server:
    ## Set the enabled flag to true for enabling metrics-server.
    ## This is required before enabling autoscaling unless you have an existing metrics-server in the cluster.
    enabled: true
    apiService:
      create: false
    global:
      compatibility:
        ## Compatibility adaptations for Openshift
        ##
        openshift:
          ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
          ##
          adaptSecurityContext: auto

  ## Configure kube-prometheus-stack
  ## ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  kube-prometheus-stack:
    prometheus-node-exporter:
      service:
        port: 9200
        targetPort: 9200
  ## Configure log collection with Otelcol
  otellogs:
    daemonset:
      containers:
        otelcol:
          securityContext:
            privileged: true
      initContainers:
        changeowner:
          securityContext:
            privileged: true

  ## Configure telegraf-operator
  ## ref: https://github.com/influxdata/helm-charts/blob/master/charts/telegraf-operator/values.yaml
  telegraf-operator:
    enabled: true

  ## Configure Tailing Sidecar Operator
  ## ref: https://github.com/SumoLogic/tailing-sidecar/blob/main/helm/tailing-sidecar-operator/values.yaml
  tailing-sidecar-operator:
    enabled: true

    ## creation of Security Context Constraints in Openshift
    scc:
      create: true

  ## pvcCleaner deletes unused PVCs
  pvcCleaner:
    metrics:
      enabled: true
    logs:
      enabled: true
